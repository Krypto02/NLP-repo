[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pylint.main]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "C0103",  # invalid-name (Streamlit top-level vars under `if` are not constants)
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0302",  # too-many-lines (large CSS block in app.py)
    "R0903",  # too-few-public-methods
    "E0401",  # import-error (Docker-only deps not installed locally)
]

[tool.pylint.design]
max-locals = 20
